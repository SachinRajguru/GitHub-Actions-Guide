name: Deploy Application to Docker Swarm

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: my-application
  STACK_NAME: my-stack

jobs:
  deploy-swarm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASS }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY_USER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy Application to Docker Swarm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SWARM_MANAGER_HOST }}
          username: ${{ secrets.SWARM_MANAGER_USER }}
          key: ${{ secrets.SWARM_MANAGER_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKER_REGISTRY_PASS }}" | docker login \
              -u "${{ secrets.DOCKER_REGISTRY_USER }}" \
              --password-stdin

            docker stack deploy \
              --compose-file stack.yaml \
              --with-registry-auth \
              ${{ env.STACK_NAME }}